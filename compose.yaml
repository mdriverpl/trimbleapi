services:
  trimble:
    image: ghcr.io/mdriverpl/trimbleapi:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      PORT: 3000
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      WORKER_COUNT: ${WORKER_COUNT:-10}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with sslmode=verify-full and sslrootcert=/app/certs/hostava-db-ca.pem}
    volumes:
      - type: bind
        source: ./files/hostava-db-ca.pem
        target: /app/certs/hostava-db-ca.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 15s
